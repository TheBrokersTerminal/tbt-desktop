# Free Windows installer build (17 Oct 2026). GitHub's own Windows machines build the proper installer (.exe setup),
# which a Mac cannot. Runs when you press "Run workflow" on the Actions tab, or when a version tag (v1.3.4…) is pushed.
# The installer appears under the run's "Artifacts". Unsigned for now: add a code-signing certificate later.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TBT-Windows-installer
          path: dist/*.exe
          retention-days: 30
